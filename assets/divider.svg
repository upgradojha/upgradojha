<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0" />
      <stop offset="20%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Track Line -->
  <rect x="0" y="11" width="1200" height="2" fill="url(#lineGrad)" />

  <!-- Center Static Cyber Nodes -->
  <polygon points="590,12 600,6 610,12 600,18" fill="#06b6d4" opacity="0.8" />
  <circle cx="560" cy="12" r="3" fill="#6366f1" />
  <circle cx="640" cy="12" r="3" fill="#6366f1" />

  <!-- Animated Scanning Energy Pulse -->
  <g>
    <rect x="-100" y="9" width="120" height="6" rx="3" fill="url(#glow)" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1300 0" dur="4.5s" repeatCount="indefinite" />
  </g>
</svg>