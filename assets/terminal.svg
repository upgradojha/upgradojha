<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; fill: #e2e8f0; }
    .prompt { fill: #10b981; font-weight: bold; }
    .cmd { fill: #38bdf8; }
    .key { fill: #a855f7; }
    .val { fill: #f8fafc; }
    .accent { fill: #06b6d4; }
    .muted { fill: #64748b; font-size: 11px; }

    .line1 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.3s; }
    .line2 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.9s; }
    .line3 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.4s; }
    .line4 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.9s; }
    .line5 { opacity: 0; animation: fadeIn 0.4s ease forwards 2.4s; }
    .line6 { opacity: 0; animation: fadeIn 0.4s ease forwards 2.9s; }
    .line7 { opacity: 0; animation: fadeIn 0.4s ease forwards 3.4s; }
    .line8 { opacity: 0; animation: fadeIn 0.4s ease forwards 3.9s; }

    .cursor { animation: blink 1s step-end infinite; fill: #06b6d4; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="496" height="306" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="3" y="3" width="494" height="34" rx="10" fill="#1e293b" />
  <circle cx="22" cy="20" r="6" fill="#ef4444" />
  <circle cx="42" cy="20" r="6" fill="#f59e0b" />
  <circle cx="62" cy="20" r="6" fill="#10b981" />
  <text x="250" y="24" text-anchor="middle" class="text muted">prashant@upgradojha: ~/telemetry — zsh</text>
  <circle cx="475" cy="20" r="4" fill="#06b6d4" class="pulse-dot" />

  <!-- Terminal Output Content -->
  <g transform="translate(20, 62)">
    <text x="0" y="0" class="text line1">
      <tspan class="prompt">➜</tspan> <tspan class="cmd">~</tspan> ./inspect_profile.sh --user=upgradojha
    </text>

    <text x="0" y="28" class="text line2">
      <tspan class="key">[IDENTITY]</tspan>   <tspan class="val">Prashant Kumar Ojha (B.Tech CSE)</tspan>
    </text>

    <text x="0" y="54" class="text line3">
      <tspan class="key">[BACKEND]</tspan>    <tspan class="val">Python • Java • FastAPI • Node • Express</tspan>
    </text>

    <text x="0" y="80" class="text line4">
      <tspan class="key">[DATA_DB]</tspan>    <tspan class="val">PostgreSQL • MongoDB • SQL • pgvector</tspan>
    </text>

    <text x="0" y="106" class="text line5">
      <tspan class="key">[DEVOPS]</tspan>     <tspan class="val">Docker • Compose • Kubernetes • AWS (EC2/S3)</tspan>
    </text>

    <text x="0" y="132" class="text line6">
      <tspan class="key">[PIPELINES]</tspan>  <tspan class="val">Databricks • Amazon S3 • n8n Automation</tspan>
    </text>

    <text x="0" y="158" class="text line7">
      <tspan class="key">[AI_STACK]</tspan>   <tspan class="val">LLMs • RAG Architectures • Vector DBs</tspan>
    </text>

    <text x="0" y="192" class="text line8">
      <tspan class="prompt">➜</tspan> <tspan class="cmd">~</tspan> <tspan class="accent">status: ready_to_build</tspan>
    </text>
    <rect x="195" y="179" width="8" height="15" class="cursor line8" />
  </g>
</svg>