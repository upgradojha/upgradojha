<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121110" stop-opacity="0" />
      <stop offset="20%" stop-color="#3D352E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#C5B095" />
      <stop offset="100%" stop-color="#121110" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F6F2" stop-opacity="1" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C5B095" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Track Line -->
  <rect x="0" y="11" width="1200" height="2" fill="url(#lineGrad)" />

  <!-- Center Static Nodes -->
  <polygon points="590,12 600,6 610,12 600,18" fill="#D4AF37" opacity="0.9" />
  <circle cx="560" cy="12" r="3" fill="#C5B095" />
  <circle cx="640" cy="12" r="3" fill="#C5B095" />

  <!-- Animated Scanning Gold Pulse -->
  <g>
    <rect x="-100" y="9" width="140" height="6" rx="3" fill="url(#glow)" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1300 0" dur="4.5s" repeatCount="indefinite" />
  </g>
</svg>